<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>link_hub</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  min-height: 100%;
  background: #060913;
}

body {
  background: transparent;
  color: #fff;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: 16px;
  position: relative;
}

/* Фоновый слой на весь экран */
body::before {
  content: "";
  position: fixed;
  inset: -10%;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(
    circle at 50% 35%,
    #0f2347 0%,
    #060913 75%
  );
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 24px;
  padding-top: calc(20px + env(safe-area-inset-top));
  z-index: 10;
}

.app-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  object-fit: cover;
  box-shadow: 0 8px 20px rgba(232,108,26,.45);
}

.brand {
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(90deg,#fff,#93c5fd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.screen {
  position: fixed;
  inset: 80px 0 calc(90px + env(safe-area-inset-bottom)) 0;
  display: none;
  align-items: center;
  justify-content: center;
}

.screen.active {
  display: flex;
}

.orbit-stage {
  position: relative;
  width: min(76vw, 310px);
  height: min(76vw, 310px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbit-ring {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 1px dashed rgba(59,130,246,.35);
  animation: spin 40s linear infinite;
  pointer-events: none;
}

.core-btn {
  width: min(176px, 48vw);
  height: min(176px, 48vw);
  border-radius: 50%;
  border: none;
  background: radial-gradient(circle at 30% 30%,#60a5fa,#2563eb 60%,#1d4ed8);
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 45px rgba(37,99,235,.8),inset 0 4px 12px rgba(255,255,255,.45);
  transition: .25s;
  z-index: 5;
  line-height: 1.25;
  animation: pulse 3s ease-in-out infinite;
  touch-action: manipulation;
}

.core-btn:hover {
  transform: scale(1.07);
}

.core-btn:active {
  transform: scale(.93);
  filter: brightness(.9);
}

.sat-track {
  position: absolute;
  inset: 0;
  animation: orbit var(--dur,16s) linear infinite;
  pointer-events: none;
}

.sat-pill {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15,23,42,.9);
  border: 1px solid rgba(96,165,250,.55);
  color: #e0f2fe;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  max-width: 170px;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 4px 18px rgba(37,99,235,.45);
  pointer-events: auto;
  animation: counter var(--dur,16s) linear infinite;
  touch-action: manipulation;
  transition: background .2s, color .2s, filter .15s;
}

.sat-pill:hover {
  background: #2563eb;
  color: #fff;
}

.sat-pill:active {
  background: #1d4ed8;
  color: #fff;
  filter: brightness(.85);
}

.links-box {
  width: 100%;
  max-width: 520px;
  height: 100%;
  padding: 12px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
}

.links-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}

.card {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  animation: fadeUp .25s ease;
}

.card-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.card-name {
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  text-decoration: none;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card-url {
  color: #93c5fd;
  font-size: 16px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.del-btn {
  background: rgba(239,68,68,.2);
  color: #fca5a5;
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 16px;
  cursor: pointer;
  transition: .15s;
}

.del-btn:hover {
  background: rgba(239,68,68,.45);
  color: #fff;
}

.del-btn:active {
  transform: scale(.94);
  filter: brightness(.85);
}

.empty {
  text-align: center;
  color: #94a3b8;
  font-size: 17px;
  margin-top: 40px;
}

nav {
  position: fixed;
  bottom: calc(18px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15,23,42,.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.12);
  padding: 6px;
  border-radius: 999px;
  display: flex;
  gap: 6px;
  z-index: 30;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}

.nav-btn {
  border: none;
  background: transparent;
  color: #94a3b8;
  font-size: 16px;
  font-weight: 600;
  padding: 12px 24px;
  border-radius: 999px;
  cursor: pointer;
  transition: .2s;
  touch-action: manipulation;
}

.nav-btn.active {
  background: #2563eb;
  color: #fff;
  box-shadow: 0 4px 14px rgba(37,99,235,.5);
}

.nav-btn:active {
  transform: scale(.95);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(2,6,23,.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top));
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 50;
}

.modal.open {
  display: flex;
}

.modal-card {
  background: #0f172a;
  border: 1px solid rgba(96,165,250,.4);
  border-radius: 24px;
  padding: 24px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 50px rgba(0,0,0,.6);
}

.modal-card h3 {
  font-size: 20px;
  margin-bottom: 14px;
}

.modal-card input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06);
  color: #fff;
  font-size: 16px;
  outline: none;
  margin-bottom: 12px;
  touch-action: manipulation;
}

.modal-card input:focus {
  border-color: #3b82f6;
}

.modal-btns {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.btn-no,
.btn-ok {
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  transition: .15s;
}

.btn-no {
  background: rgba(255,255,255,.1);
  color: #cbd5e1;
}

.btn-ok {
  background: #2563eb;
  color: #fff;
}

.btn-no:active,
.btn-ok:active {
  transform: scale(.95);
  filter: brightness(.85);
}

@keyframes orbit {
  from {
    transform: rotate(var(--start,0deg));
  }
  to {
    transform: rotate(calc(var(--start,0deg) + 360deg));
  }
}

@keyframes counter {
  from {
    transform: translateX(-50%) rotate(calc(-1 * var(--start,0deg)));
  }
  to {
    transform: translateX(-50%) rotate(calc(-1 * var(--start,0deg) - 360deg));
  }
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes pulse {
  0%,100% {
    box-shadow: 0 0 42px rgba(37,99,235,.7),inset 0 4px 12px rgba(255,255,255,.45);
  }
  50% {
    box-shadow: 0 0 62px rgba(59,130,246,.95),inset 0 4px 14px rgba(255,255,255,.55);
  }
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Компактная адаптация для узких экранов */
@media (max-width: 380px) {
  header {
    padding-left: 16px;
    padding-right: 16px;
  }

  .orbit-stage {
    width: min(76vw, 310px);
    height: min(76vw, 310px);
  }

  .nav-btn {
    padding-left: 20px;
    padding-right: 20px;
  }
}
</style>
</head>

<body>

<header>
  <img src="icon.png" alt="link_hub" class="app-icon">
  <div class="brand">link_hub</div>
</header>

<div id="tab-home" class="screen active">
  <div class="orbit-stage">
    <div class="orbit-ring"></div>
    <div id="sats"></div>
    <button type="button" class="core-btn" id="btn-create">
      Создать<br>ссылку
    </button>
  </div>
</div>

<div id="tab-links" class="screen">
  <div class="links-box">
    <div class="links-title">Мои ссылки</div>
    <div id="list"></div>
  </div>
</div>

<nav>
  <button type="button" class="nav-btn active" id="nav-home">Главная</button>
  <button type="button" class="nav-btn" id="nav-links">Ссылки</button>
</nav>

<div class="modal" id="modal">
  <div class="modal-card">
    <h3>Новая ссылка</h3>

    <input
      type="text"
      id="in-url"
      placeholder="Ссылка (например: youtube.com)"
      autocomplete="off"
    >

    <input
      type="text"
      id="in-name"
      placeholder="Название (необязательно)"
      autocomplete="off"
    >

    <div class="modal-btns">
      <button type="button" class="btn-no" id="btn-cancel">Отмена</button>
      <button type="button" class="btn-ok" id="btn-save">Запустить</button>
    </div>
  </div>
</div>

<script>
let items = JSON.parse(localStorage.getItem('link_hub_items') || '[]');

const modal = document.getElementById('modal');
const inUrl = document.getElementById('in-url');
const inName = document.getElementById('in-name');

document.getElementById('nav-home').onclick = () => {
  document.getElementById('nav-home').classList.add('active');
  document.getElementById('nav-links').classList.remove('active');
  document.getElementById('tab-home').classList.add('active');
  document.getElementById('tab-links').classList.remove('active');
};

document.getElementById('nav-links').onclick = () => {
  document.getElementById('nav-links').classList.add('active');
  document.getElementById('nav-home').classList.remove('active');
  document.getElementById('tab-links').classList.add('active');
  document.getElementById('tab-home').classList.remove('active');
};

document.getElementById('btn-create').onclick = () => {
  modal.classList.add('open');
  setTimeout(() => inUrl.focus(), 50);
};

document.getElementById('btn-cancel').onclick = () => {
  modal.classList.remove('open');
};

modal.onclick = (e) => {
  if (e.target === modal) modal.classList.remove('open');
};

function save() {
  let u = inUrl.value.trim();

  if (!u) return;

  if (!/^https?:\/\//i.test(u)) {
    u = 'https://' + u;
  }

  const dom = u.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
  const lbl = inName.value.trim() || dom;

  items.unshift({
    id: Date.now(),
    url: u,
    label: lbl,
    domain: dom
  });

  localStorage.setItem('link_hub_items', JSON.stringify(items));

  inUrl.value = '';
  inName.value = '';

  modal.classList.remove('open');
  draw();
}

document.getElementById('btn-save').onclick = save;

inUrl.onkeydown = (e) => {
  if (e.key === 'Enter') save();
};

inName.onkeydown = (e) => {
  if (e.key === 'Enter') save();
};

function del(id) {
  items = items.filter(x => x.id !== id);
  localStorage.setItem('link_hub_items', JSON.stringify(items));
  draw();
}

function draw() {
  const sats = document.getElementById('sats');
  const list = document.getElementById('list');

  sats.innerHTML = '';

  items.forEach((it, i) => {
    const tr = document.createElement('div');

    tr.className = 'sat-track';
    tr.style.setProperty('--start', (360 / items.length) * i + 'deg');
    tr.style.setProperty('--dur', (14 + (i % 4) * 3) + 's');

    const a = document.createElement('a');

    a.className = 'sat-pill';
    a.href = it.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = it.label;

    tr.appendChild(a);
    sats.appendChild(tr);
  });

  if (!items.length) {
    list.innerHTML = '<div class="empty">Пока пусто. Нажми на синюю сферу на главной!</div>';
    return;
  }

  list.innerHTML = items.map(it =>
    `<div class="card"><div class="card-info"><a class="card-name" href="${it.url}" target="_blank">${it.label}</a><span class="card-url">${it.domain}</span></div><button type="button" class="del-btn" onclick="del(${it.id})">Удалить</button></div>`
  ).join('');
}

draw();
</script>

</body>
</html>
