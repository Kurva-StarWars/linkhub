<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>link_hub</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 35%, #0f2347 0%, #060913 75%);
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 24px;
      z-index: 10;
    }
    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(232, 108, 26, 0.45);
      flex-shrink: 0;
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 90px;
    }
    .tab-view {
      position: absolute;
      inset: 0 0 90px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tab-view.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .orbit-stage {
      position: relative;
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orbit-ring {
      position: absolute;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      border: 1px dashed rgba(59, 130, 246, 0.35);
      animation: spinSlow 40s linear infinite;
      pointer-events: none;
    }
    .core-btn {
      width: 176px;
      height: 176px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb 60%, #1d4ed8);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 45px rgba(37, 99, 235, 0.75), inset 0 4px 12px rgba(255,255,255,0.45);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      z-index: 5;
      padding: 16px;
      text-align: center;
      line-height: 1.25;
      animation: pulseCore 3s ease-in-out infinite;
    }
    .core-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 65px rgba(59, 130, 246, 0.95), inset 0 4px 16px rgba(255,255,255,0.6);
    }
    .core-btn:active { transform: scale(0.95); }

    .satellite-track {
      position: absolute;
      inset: 0;
      animation: orbitSpin var(--dur, 16s) linear infinite;
      pointer-events: none;
    }
    .satellite-pill {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(96, 165, 250, 0.5);
      color: #e0f2fe;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.45);
      pointer-events: auto;
      animation: counterSpin var(--dur, 16s) linear infinite;
      transition: background 0.2s, transform 0.2s;
    }
    .satellite-pill:hover {
      background: #2563eb;
      color: #fff;
      z-index: 20;
    }

    .links-container {
      width: 100%;
      max-width: 520px;
      height: 100%;
      padding: 12px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .links-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .link-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: slideUp 0.3s ease forwards;
    }
    .link-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .link-name {
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-url {
      color: #93c5fd;
      font-size: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .del-btn {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      transition: 0.2s;
    }
    .del-btn:hover { background: rgba(239, 68, 68, 0.4); color: #fff; }
    .empty-state {
      text-align: center;
      color: #94a3b8;
      font-size: 17px;
      margin-top: 40px;
    }

    nav {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px;
      border-radius: 999px;
      display: flex;
      gap: 6px;
      z-index: 30;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .nav-btn.active {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 50;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      transform: translateY(16px) scale(0.96);
      transition: transform 0.25s ease;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal-backdrop.open .modal-box { transform: translateY(0) scale(1); }
    .modal-box h3 { font-size: 20px; margin-bottom: 14px; }
    .modal-box input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 16px;
      outline: none;
      margin-bottom: 12px;
    }
    .modal-box input:focus { border-color: #3b82f6; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .btn-cancel, .btn-save {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel { background: rgba(255,255,255,0.1); color: #cbd5e1; }
    .btn-save { background: #2563eb; color: #fff; }

    @keyframes orbitSpin { from { transform: rotate(var(--start, 0deg)); } to { transform: rotate(calc(var(--start, 0deg) + 360deg)); } }
    @keyframes counterSpin { from { transform: translateX(-50%) rotate(calc(-1 * var(--start, 0deg))); } to { transform: translateX(-50%) rotate(calc(-1 * var(--start, 0deg) - 360deg)); } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulseCore {
      0%, 100% { box-shadow: 0 0 42px rgba(37, 99, 235, 0.7), inset 0 4px 12px rgba(255,255,255,0.45); }
      50% { box-shadow: 0 0 62px rgba(59, 130, 246, 0.95), inset 0 4px 14px rgba(255,255,255,0.55); }
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <img src="icon.png" alt="link_hub" class="app-icon" />
    <div class="brand">link_hub</div>
  </header>

  <main>
    <section id="tab-home" class="tab-view active">
      <div class="orbit-stage" id="orbit-stage">
        <div class="orbit-ring"></div>
        <div id="satellites-layer"></div>
        <button class="core-btn" id="open-modal-btn">Создать<br>ссылку</button>
      </div>
    </section>

    <section id="tab-links" class="tab-view">
      <div class="links-container">
        <div class="links-title">Мои ссылки</div>
        <div id="links-list"></div>
      </div>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" data-target="tab-home">Главная</button>
    <button class="nav-btn" data-target="tab-links">Ссылки</button>
  </nav>

  <div class="modal-backdrop" id="modal">
    <div class="modal-box">
      <h3>Новая ссылка</h3>
      <input type="text" id="url-input" placeholder="Ссылка (например: youtube.com)" autocomplete="off" />
      <input type="text" id="title-input" placeholder="Название (необязательно)" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn-cancel" id="close-modal-btn">Отмена</button>
        <button class="btn-save" id="save-link-btn">Запустить</button>
      </div>
    </div>
